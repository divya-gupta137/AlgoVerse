<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Visualizer — AlgoVerse</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>

  <!-- Navigation Header -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        Algo<span>Verse</span>
      </a>
      
      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="learn.html" class="nav-link">Learn</a></li>
          <li><a href="visualizer.html" class="nav-link active">Visualizer</a></li>
        </ul>
      </nav>

      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark/light theme">
        <svg class="theme-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <span>Light Mode</span>
      </button>
    </div>
  </header>

  <!-- Main Content Shell -->
  <main class="container">
    <!-- Title & Category Header -->
    <div class="visualizer-header">
      <div>
        <h1 id="algo-title" style="font-size: 2.25rem; margin-bottom: 0.25rem;">Bubble Sort</h1>
        <span id="algo-category" class="badge badge-sorting">Sorting</span>
      </div>
      
      <a href="learn.html" class="btn btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">
        ← Back to Catalog
      </a>
    </div>

    <!-- 1. Top Concept Overview Container (Shown at Top for Array, Stack, Queue) -->
    <div id="top-concept-container"></div>

    <!-- 2. Interactive Workbench Container (Split Left/Right for Stack/Queue, Natural Stack for Array/Sorting) -->
    <div id="visualizer-workbench" class="visualizer-workbench">
      <div class="workbench-controls-col">
        <div class="input-control-card"></div>
      </div>

      <div class="workbench-visualizer-col">
        <!-- TOP Transport Controls & Stats Bar -->
        <div class="transport-bar">
          <div class="transport-controls-row">
            <div class="transport-btn-group">
              <button id="btn-reset" class="transport-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Reset</button>
              <button id="btn-step-prev" class="transport-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg> Prev</button>
              <button id="btn-play-pause" class="transport-btn active"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="6 4 20 12 6 20 6 4"/></svg> Play</button>
              <button id="btn-step-next" class="transport-btn">Next <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
            </div>

            <!-- Stats Counters -->
            <div class="stats-row" style="margin-top: 0;">
              <div class="stat-badge-card">
                Comparisons: <span id="stat-comparisons" class="stat-val">0</span>
              </div>
              <div class="stat-badge-card">
                Swaps: <span id="stat-swaps" class="stat-val">0</span>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <label for="select-speed" style="font-size: 0.85rem; color: var(--text-secondary);">Speed:</label>
              <select id="select-speed" class="speed-select">
                <option value="0.5">0.5x (Slow)</option>
                <option value="1" selected>1.0x (Normal)</option>
                <option value="2">2.0x (Fast)</option>
                <option value="4">4.0x (Ultra)</option>
              </select>
            </div>
          </div>

          <div class="timeline-row">
            <input type="range" id="timeline-scrubber" class="scrubber-slider" min="0" max="0" value="0">
            <span id="step-counter" class="step-badge">Step 0 of 0</span>
          </div>
        </div>

        <!-- Step Narration Box -->
        <div class="narration-box">
          <span class="narration-tag">LOG</span> <span id="narration-text">Initializing visualization...</span>
        </div>

        <!-- Main Visualization Viewport Container -->
        <div id="visualization-viewport" class="visualization-viewport"></div>
      </div>
    </div>

    <!-- Active Code Highlighting Panel -->
    <div id="code-panel-container"></div>

    <!-- Educational Concept & Theory Guide Section -->
    <div id="concept-guide-container"></div>
  </main>


  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 AlgoVerse. Interactive Data Structures & Algorithms Visualizer Platform.</p>
    </div>
  </footer>

  <!-- Script Modules -->
  <script type="module">
    import { ThemeManager } from './scripts/core/theme.js';
    import './scripts/pages/visualizer.js';

    const themeManager = new ThemeManager();
    themeManager.init();
  </script>
</body>
</html>
